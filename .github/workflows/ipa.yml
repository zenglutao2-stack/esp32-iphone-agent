name: IPA (unsigned, for sideloading)

# Build an unsigned Release IPA on GitHub's free macOS runner, then attach it to
# a release so it can be downloaded without the Actions artifact login.
# No Apple ID, no Mac required — sideload with SideStore/AltStore (free Apple ID, 7-day re-sign).

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/ipa.yml]

permissions:
  contents: write  # for the release upload step

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen

      - name: Build unsigned (app + widget extension)
        run: |
          xcodebuild -project IPhoneAgent.xcodeproj -scheme IPhoneAgent \
            -configuration Release -destination "generic/platform=iOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA (Payload/IPhoneAgent.app zipped, unsigned)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPhoneAgent.app Payload/
          zip -qr IPhoneAgent-unsigned.ipa Payload
          ls -la IPhoneAgent-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IPhoneAgent-unsigned-ipa
          path: ios/IPhoneAgent-unsigned.ipa
          retention-days: 7

      - name: Attach IPA to a release (downloadable without login)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-r${{ github.run_number }}
          name: Unsigned IPA build ${{ github.run_number }}
          body: Unsigned IPhoneAgent IPA for SideStore/AltStore sideloading. Sign on-device with a free Apple ID (7-day re-sign).
          files: ios/IPhoneAgent-unsigned.ipa
          prerelease: true
